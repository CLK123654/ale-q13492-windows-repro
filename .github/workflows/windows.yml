name: NativeWindowsReproduction

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: PrepareSQLite
        shell: pwsh
        run: |
          Write-Host SQLite executable can be provided with SQLITE3_EXECUTABLE
      - name: ReviewStaticContract
        shell: pwsh
        run: node verification/static_portability.mjs
